name: CI - Validate Infrastructure Code

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-terraform:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.6.x

      - name: Terraform Format
        working-directory: ./terraform/environments/lab
        run: terraform fmt -check

      - name: Terraform Init
        working-directory: ./terraform/environments/lab
        run: terraform init -backend=false

      - name: Terraform Validate
        working-directory: ./terraform/environments/lab
        run: terraform validate

  validate-ansible:
    name: Validate Ansible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Ansible Lint
        run: ansible-lint ansible/site.yml --exclude rules/dependency.yml || true

      - name: YAML Lint
        run: yamllint -d "{extends: relaxed, rules: {line-length: disable}}" ansible/

  check-structure:
    name: Check Repository Structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify directory structure
        run: |
          test -d terraform/modules/vyos-vm
          test -d terraform/environments/lab
          test -d ansible/roles/common
          test -d ansible/roles/vyos-firewall
          test -d ansible/roles/docker-services
          test -d ansible/roles/database
          test -d ansible/roles/wazuh-agent
          test -d docs/adr
          test -f AGENTS.md
          test -f README.md
          test -f INSTRUCTIONS.md